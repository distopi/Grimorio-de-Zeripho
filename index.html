<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grimorio de Zeripho</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        cinzel: ['Cinzel', 'serif'],
                        inter: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen transition-colors duration-300">

    <header class="border-b sticky top-0 z-40 shadow-lg" style="background-color: var(--bg-card); border-color: var(--border-color);">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center justify-between w-full md:w-auto">
                <div class="flex items-center space-x-3">
                    <div class="p-2 rounded-lg text-white shadow-md" style="background-color: var(--accent);">
                        <i class="fa-solid fa-book-skull text-2xl"></i>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold font-rpg tracking-wide" style="color: var(--accent);">Grimorio de Zeripho</h1>
                        <p class="text-xs opacity-75">Grimório, Regras e Equipamentos</p>
                    </div>
                </div>
                <!-- Botão de Menu Mobile para as Abas -->
                <button onclick="toggleMobileNav()" class="md:hidden p-2 rounded-lg border transition" style="background-color: var(--bg-card); border-color: var(--border-color); color: var(--accent);" title="Menu de Categorias">
                    <i class="fa-solid fa-bars text-lg"></i>
                </button>
            </div>
            
            <div class="flex items-center gap-3 w-full md:w-auto">
                <div class="relative flex-1 md:w-72">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 opacity-60">
                        <i class="fa-solid fa-search"></i>
                    </span>
                    <input type="text" id="globalSearch" placeholder="Pesquisar em tudo..." 
                        class="w-full pl-10 pr-4 py-2 rounded-lg text-sm focus:outline-none border transition" style="background-color: var(--bg-main); border-color: var(--border-color); color: var(--text-main);">
                </div>
                
                <!-- Botão de Tema -->
                <button id="themeToggle" class="p-2 rounded-lg border transition" style="background-color: var(--bg-card); border-color: var(--border-color); color: var(--accent);" title="Alternar Tema">
                    <i class="fa-solid fa-moon"></i>
                </button>

                <!-- Botão de Cores -->
                <div class="relative">
                    <button id="paletteToggle" class="p-2 rounded-lg border transition" style="background-color: var(--bg-card); border-color: var(--border-color); color: var(--accent);" title="Personalizar Cores">
                        <i class="fa-solid fa-palette"></i>
                    </button>
                    <div id="colorDropdown" class="absolute right-0 mt-2 w-52 rounded-xl shadow-2xl p-3 hidden z-50 border" style="background-color: var(--bg-card); border-color: var(--border-color);">
                        <p class="text-xs font-rpg mb-2 font-bold" style="color: var(--accent);">Cor de Destaque</p>
                        <div class="grid grid-cols-5 gap-2 mb-3">
                            <button onclick="setAccentColor('#d97706')" class="w-7 h-7 rounded-full bg-amber-600 hover:scale-110 transition shadow" title="Dourado RPG"></button>
                            <button onclick="setAccentColor('#dc2626')" class="w-7 h-7 rounded-full bg-red-600 hover:scale-110 transition shadow" title="Vermelho Fogo"></button>
                            <button onclick="setAccentColor('#2563eb')" class="w-7 h-7 rounded-full bg-blue-600 hover:scale-110 transition shadow" title="Azul Arcano"></button>
                            <button onclick="setAccentColor('#16a34a')" class="w-7 h-7 rounded-full bg-green-600 hover:scale-110 transition shadow" title="Verde Natureza"></button>
                            <button onclick="setAccentColor('#9333ea')" class="w-7 h-7 rounded-full bg-purple-600 hover:scale-110 transition shadow" title="Roxo Místico"></button>
                        </div>
                        <div class="pt-2 border-t" style="border-color: var(--border-color);">
                            <label class="text-[10px] opacity-70 block mb-1">Cor Personalizada:</label>
                            <input type="color" id="customColorPicker" onchange="setCustomAccent(this.value)" class="w-full h-8 bg-transparent cursor-pointer rounded border" style="border-color: var(--border-color);">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Navegação com colapso mobile animado -->
        <nav class="max-w-7xl mx-auto px-4 py-2">
            <div id="navContainer" class="hidden md:flex flex-wrap md:flex-nowrap md:overflow-x-auto justify-center md:justify-start gap-1.5 pb-2 pt-1 transition-all duration-300">
                <button onclick="switchTab('classes')" class="tab-btn px-3 py-1.5 rounded-lg font-rpg text-xs md:text-sm font-semibold text-white transition shadow" style="background-color: var(--accent);"><i class="fa-solid fa-shield-halved mr-1.5"></i>Classes</button>
                <button onclick="switchTab('subclasses')" class="tab-btn px-3 py-1.5 rounded-lg font-rpg text-xs md:text-sm font-semibold opacity-75 hover:opacity-100 transition"><i class="fa-solid fa-hat-wizard mr-1.5"></i>Subclasses</button>
                <button onclick="switchTab('racas')" class="tab-btn px-3 py-1.5 rounded-lg font-rpg text-xs md:text-sm font-semibold opacity-75 hover:opacity-100 transition"><i class="fa-solid fa-dna mr-1.5"></i>Raças</button>
                <button onclick="switchTab('talentos')" class="tab-btn px-3 py-1.5 rounded-lg font-rpg text-xs md:text-sm font-semibold opacity-75 hover:opacity-100 transition"><i class="fa-solid fa-medal mr-1.5"></i>Talentos</button>
                <button onclick="switchTab('opcoes')" class="tab-btn px-3 py-1.5 rounded-lg font-rpg text-xs md:text-sm font-semibold opacity-75 hover:opacity-100 transition"><i class="fa-solid fa-wand-magic-sparkles mr-1.5"></i>Opções</button>
                <button onclick="switchTab('antecedentes')" class="tab-btn px-3 py-1.5 rounded-lg font-rpg text-xs md:text-sm font-semibold opacity-75 hover:opacity-100 transition"><i class="fa-solid fa-scroll mr-1.5"></i>Antecedentes</button>
                <button onclick="switchTab('magias')" class="tab-btn px-3 py-1.5 rounded-lg font-rpg text-xs md:text-sm font-semibold opacity-75 hover:opacity-100 transition"><i class="fa-solid fa-fire mr-1.5"></i>Magias</button>
                <button onclick="switchTab('itensMagicos')" class="tab-btn px-3 py-1.5 rounded-lg font-rpg text-xs md:text-sm font-semibold opacity-75 hover:opacity-100 transition"><i class="fa-solid fa-gem mr-1.5"></i>Itens Mágicos</button>
                <button onclick="switchTab('equipamentos')" class="tab-btn px-3 py-1.5 rounded-lg font-rpg text-xs md:text-sm font-semibold opacity-75 hover:opacity-100 transition"><i class="fa-solid fa-vest mr-1.5"></i>Equipamentos</button>
                <button onclick="switchTab('favoritos')" class="tab-btn px-3 py-1.5 rounded-lg font-rpg text-xs md:text-sm font-semibold opacity-75 hover:opacity-100 transition"><i class="fa-solid fa-star text-amber-400 mr-1.5"></i>Favoritos</button>
            </div>
        </nav>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <div id="tabContent"></div>
    </main>

    <!-- Modal Principal -->
    <div id="detailModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm hidden p-4">
        <div class="border w-full max-w-4xl max-h-[90vh] rounded-xl shadow-2xl flex flex-col overflow-hidden" style="background-color: var(--bg-card); border-color: var(--border-color);">
            <div class="p-6 border-b flex justify-between items-center" style="background-color: var(--bg-main); border-color: var(--border-color);">
                <div class="flex items-center gap-3">
                    <h2 id="modalTitle" class="text-2xl font-bold font-rpg" style="color: var(--accent);">Título</h2>
                    <button id="modalFavBtn" onclick="toggleModalFavorite()" class="text-xl transition" style="color: var(--accent);"><i class="fa-regular fa-star"></i></button>
                </div>
                <button onclick="closeModal()" class="text-xl p-2 opacity-75 hover:opacity-100"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="modalBody" class="p-6 overflow-y-auto space-y-6 text-sm md:text-base"></div>
        </div>
    </div>

    <!-- Modal Secundária (Subclasses) -->
    <div id="subModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm hidden p-4">
        <div class="border w-full max-w-2xl max-h-[85vh] rounded-xl shadow-2xl flex flex-col overflow-hidden" style="background-color: var(--bg-card); border-color: var(--accent);">
            <div class="p-5 border-b flex justify-between items-center" style="background-color: var(--bg-main); border-color: var(--border-color);">
                <h3 id="subModalTitle" class="text-xl font-bold font-rpg" style="color: var(--accent);">Subclasse</h3>
                <button onclick="closeSubModal()" class="text-xl p-2 opacity-75 hover:opacity-100"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="subModalBody" class="p-6 overflow-y-auto space-y-4 text-sm"></div>
        </div>
    </div>

    <footer class="text-center py-6 text-xs opacity-60 border-t mt-12" style="border-color: var(--border-color);">
       Grimorio de Zeripho
    </footer>

    <script src="js/loader.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
